<svg
  width="1180"
  height="610"
  viewBox="0 0 1180 610"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-label="Sumit Pawar profile banner">

  <title>Sumit Pawar — Java Backend Developer</title>

  <defs>

    <!-- Main gradient -->
    <linearGradient
      id="accent"
      x1="0"
      y1="0"
      x2="1180"
      y2="610"
      gradientUnits="userSpaceOnUse">

      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset="0.5" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#10B981"/>

      <animateTransform
        attributeName="gradientTransform"
        type="rotate"
        values="0 590 305;360 590 305"
        dur="18s"
        repeatCount="indefinite"/>
    </linearGradient>

    <!-- Name gradient -->
    <linearGradient
      id="nameGradient"
      x1="515"
      y1="120"
      x2="850"
      y2="120"
      gradientUnits="userSpaceOnUse">

      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset="0.5" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>

    <!-- Purple glow -->
    <radialGradient id="purpleGlow">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>

    <!-- Cyan glow -->
    <radialGradient id="cyanGlow">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.40"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>

    <!-- Emerald glow -->
    <radialGradient id="greenGlow">
      <stop offset="0" stop-color="#10B981" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>

    <!-- Glass -->
    <linearGradient
      id="glass"
      x1="0"
      y1="0"
      x2="1"
      y2="1">

      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.07"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.02"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Glow filter -->
    <filter
      id="blur"
      x="-50%"
      y="-50%"
      width="200%"
      height="200%">

      <feGaussianBlur stdDeviation="25"/>
    </filter>

    <filter
      id="smallGlow"
      x="-50%"
      y="-50%"
      width="200%"
      height="200%">

      <feGaussianBlur stdDeviation="4"/>
    </filter>

    <!-- Outer clipping -->
    <clipPath id="canvasClip">
      <rect
        x="0"
        y="0"
        width="1180"
        height="610"
        rx="28"/>
    </clipPath>

  </defs>


  <!-- ====================================================== -->
  <!-- BACKGROUND -->
  <!-- ====================================================== -->

  <g clip-path="url(#canvasClip)">

    <rect
      width="1180"
      height="610"
      fill="#030712"/>

    <!-- Purple background -->
    <circle
      cx="140"
      cy="100"
      r="230"
      fill="url(#purpleGlow)"
      filter="url(#blur)">

      <animate
        attributeName="cx"
        values="140;220;140"
        dur="16s"
        repeatCount="indefinite"/>

      <animate
        attributeName="cy"
        values="100;180;100"
        dur="19s"
        repeatCount="indefinite"/>
    </circle>

    <!-- Cyan background -->
    <circle
      cx="1040"
      cy="130"
      r="250"
      fill="url(#cyanGlow)"
      filter="url(#blur)">

