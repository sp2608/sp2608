        attributeName="cx"
        values="1040;950;1040"
        dur="17s"
        repeatCount="indefinite"/>

      <animate
        attributeName="cy"
        values="130;80;130"
        dur="14s"
        repeatCount="indefinite"/>
    </circle>

    <!-- Green background -->
    <circle
      cx="650"
      cy="570"
      r="250"
      fill="url(#greenGlow)"
