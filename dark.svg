```svg
<svg
  width="1180"
  height="610"
  viewBox="0 0 1180 610"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-label="Sumit Pawar profile banner"
>
  <title>Sumit Pawar — Software Engineer</title>

  <defs>

    <!-- ==================== GRADIENTS ==================== -->

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED">
        <animate
          attributeName="stop-color"
          values="#7C3AED;#22D3EE;#10B981;#7C3AED"
          dur="10s"
          repeatCount="indefinite"
        />
      </stop>

      <stop offset="50%" stop-color="#22D3EE">
        <animate
          attributeName="stop-color"
          values="#22D3EE;#10B981;#7C3AED;#22D3EE"
          dur="10s"
          repeatCount="indefinite"
        />
      </stop>

      <stop offset="100%" stop-color="#10B981">
        <animate
          attributeName="stop-color"
          values="#10B981;#7C3AED;#22D3EE;#10B981"
          dur="10s"
          repeatCount="indefinite"
        />
      </stop>

      <animateTransform
        attributeName="gradientTransform"
        type="rotate"
        values="0 .5 .5;360 .5 .5"
        dur="18s"
        repeatCount="indefinite"
      />
    </linearGradient>


    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="50%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#10B981"/>

      <animateTransform
        attributeName="gradientTransform"
        type="translate"
        values="-0.3 0;0.3 0;-0.3 0"
        dur="8s"
        repeatCount="indefinite"
      />
    </linearGradient>


    <linearGradient id="asciiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#7C3AED"/>

      <animateTransform
        attributeName="gradientTransform"
        type="rotate"
        values="0 .5 .5;360 .5 .5"
        dur="14s"
        repeatCount="indefinite"
      />
    </linearGradient>


    <radialGradient id="blobPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="blobCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="blobEmerald" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>


    <linearGradient id="glassSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>


    <linearGradient id="borderShimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0"/>
      <stop offset="50%" stop-color="#22D3EE" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>

      <animateTransform
        attributeName="gradientTransform"
        type="translate"
        values="-1.2 0;1.2 0"
        dur="5s"
        repeatCount="indefinite"
      />
    </linearGradient>


    <!-- ==================== PATTERN ==================== -->

    <pattern
      id="noise"
      width="6"
      height="6"
      patternUnits="userSpaceOnUse"
    >
      <rect width="6" height="6" fill="none"/>
      <circle cx="1" cy="1" r="0.5" fill="#F8FAFC" opacity="0.05"/>
      <circle cx="4" cy="3" r="0.5" fill="#F8FAFC" opacity="0.05"/>
      <circle cx="2" cy="5" r="0.5" fill="#F8FAFC" opacity="0.05"/>
    </pattern>


    <!-- ==================== FILTERS ==================== -->

    <filter
      id="softBlur"
      x="-50%"
      y="-50%"
      width="200%"
      height="200%"
    >
      <feGaussianBlur stdDeviation="24"/>
    </filter>

    <filter
      id="glow"
      x="-80%"
      y="-80%"
      width="260%"
      height="260%"
    >
      <feGaussianBlur stdDeviation="3.2" result="blur"/>

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>


    <!-- ==================== CLIPS ==================== -->

    <clipPath id="canvasClip">
      <rect
        x="0"
        y="0"
        width="1180"
        height="610"
        rx="28"
      />
    </clipPath>

    <clipPath id="leftPanelClip">
      <rect
        x="48"
        y="48"
        width="403"
        height="514"
        rx="18"
      />
    </clipPath>

    <clipPath id="rightPanelClip">
      <rect
        x="475"
        y="48"
        width="657"
        height="514"
        rx="18"
      />
    </clipPath>

  </defs>


